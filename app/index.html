<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveDesk</title>
<style>
:root{--bg:#14161c;--panel:#1c1f28;--panel2:#252936;--line:#323748;--tx:#e6e8ef;--mut:#8b91a5;--acc:#6c8cff;--acc2:#4b6bff;--danger:#ff6b7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font:13px/1.4 system-ui,"Malgun Gothic",sans-serif;overflow:hidden}
#app{display:grid;grid-template:48px 1fr/250px 1fr 290px;height:100%;background:var(--bg)}
header{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header .logo{font-weight:700;font-size:15px;margin-right:10px;letter-spacing:.3px}
header .logo b{color:var(--acc)}
header .sp{flex:1}
aside{background:var(--panel);overflow-y:auto;padding:12px}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
#stage{position:relative;overflow:hidden;background:
 repeating-conic-gradient(#191c24 0 25%,#15171e 0 50%) 0 0/24px 24px;touch-action:none}
#cv{position:absolute;display:block;box-shadow:0 8px 40px #000a}
h3{margin:14px 0 8px;font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
h3:first-child{margin-top:0}
button,select,input[type=text],input[type=number]{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;min-width:0}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.pri{background:var(--acc2);border-color:var(--acc2);font-weight:600}button.pri:hover{background:var(--acc)}
button.on{border-color:var(--acc);color:var(--acc)}
button.wide{width:100%;padding:8px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px}
.grid button span{font-size:19px;line-height:1.1}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row>span:first-child{flex:0 0 76px;color:var(--mut)}
.row>input,.row>select{flex:1}
.row input[type=checkbox]{flex:0 0 auto}
.row input[type=color]{flex:0 0 44px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.row input.num{flex:0 0 58px;padding:3px 4px;text-align:right;font-variant-numeric:tabular-nums}
.row input.frames{flex:0 0 62px;padding:5px 4px;text-align:right}
.row button.x{flex:0 0 auto;border:0;background:none;color:var(--mut);padding:2px 4px}.row button.x:hover{color:var(--danger)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.two label{display:flex;align-items:center;gap:6px}.two span{color:var(--mut);flex:0 0 14px}.two input{flex:1;width:100%}
input[type=range]{accent-color:var(--acc);min-width:0}
.layer{display:flex;align-items:center;gap:2px;padding:3px 4px;border-radius:6px;border:1px solid transparent}
.layer:hover{background:var(--panel2)}.layer.sel{border-color:var(--acc);background:var(--panel2)}
.layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:3px 4px}
.layer button{border:0;background:none;padding:2px 4px;color:var(--mut)}.layer button:hover{color:var(--tx)}
.layer button.off{opacity:.3}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:8px 0}
.card .hd{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.card .hd button{border:0;background:none;color:var(--mut)}.card .hd button:hover{color:var(--danger)}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
#selbox{position:absolute;border:1.5px solid var(--acc);pointer-events:none;box-shadow:0 0 0 1px #0008}
#selbox i{position:absolute;width:12px;height:12px;margin:-6px;background:#fff;border:2px solid var(--acc);border-radius:3px;pointer-events:auto}
#selbox i[data-h=nw]{left:0;top:0;cursor:nwse-resize}#selbox i[data-h=ne]{left:100%;top:0;cursor:nesw-resize}
#selbox i[data-h=sw]{left:0;top:100%;cursor:nesw-resize}#selbox i[data-h=se]{left:100%;top:100%;cursor:nwse-resize}
#selbox i[data-h=rot]{left:50%;top:-26px;border-radius:50%;cursor:grab}
#selbox::before{content:"";position:absolute;left:50%;top:-26px;height:26px;border-left:1.5px solid var(--acc)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
#hint{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#000a;padding:6px 14px;border-radius:16px;z-index:30;display:none}
body.drop #stage{outline:2px dashed var(--acc);outline-offset:-8px}
/* 전체화면(배경화면 / 미리보기) */
body.full #app{display:block;background:#000}
body.full header,body.full aside,body.full #selbox{display:none}
body.full #stage{position:fixed;inset:0;background:#000}
body.full #cv{box-shadow:none}
body.full.pv #hint{display:block}
body.full:not(.pv){cursor:default}
details.cat{margin:0 0 6px;border:1px solid var(--line);border-radius:8px;background:#0002}
details.cat>summary{cursor:pointer;padding:6px 9px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary::before{content:"▸";color:var(--mut);font-size:10px;width:10px}
details.cat[open]>summary::before{content:"▾"}
details.cat>summary small{margin-left:auto;color:var(--mut);font-weight:400}
details.cat>.grid{padding:0 6px 6px}
.note{color:var(--mut);font-size:11px;margin:4px 0}
body.pe #hint{display:block;top:58px;background:#000d;border:1px solid var(--acc)}
body.pe #stage{cursor:crosshair}body.pe #selbox{display:none}
/* 보관함(홈) */
.sp{flex:1}
#home{display:none;height:100%;background:var(--bg);flex-direction:column}
body.home #home{display:flex}body.home #app{display:none}
#home header{flex:0 0 48px}
#homeBody{flex:1;overflow-y:auto;padding:22px 26px}
.hrow{display:flex;align-items:center;gap:8px;margin-bottom:16px}.hrow h2{margin:0;font-size:17px}
.hrow small{color:var(--mut);margin-left:6px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.wc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wc.act{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.wc .th{position:relative;aspect-ratio:16/9;background:#000 center/cover no-repeat;cursor:pointer}
.wc .badge{position:absolute;left:8px;top:8px;background:var(--acc2);padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.wc .nm{padding:9px 10px 2px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc .nm input{width:100%}
.wc .bt{display:flex;gap:6px;padding:8px 10px 10px}
.wc .bt button.ic{padding:5px 7px;color:var(--mut)}.wc .bt button.ic:hover{color:var(--tx)}
.wc .bt button.sure{color:var(--danger);border-color:var(--danger)}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600}
.sw input{display:none}
.sw i{width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:.15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--acc2)}.sw input:checked+i::after{left:21px}
.chk{display:flex;align-items:center;gap:6px;color:var(--mut);margin-right:14px;cursor:pointer}
body:not(.hosted) .hostonly{display:none}
#sceneName{color:var(--mut);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:6px}
</style>
</head>
<body>
<div id="home">
 <header>
  <div class="logo">Live<b>Desk</b></div>
  <div class="sp"></div>
  <label class="chk hostonly"><input type="checkbox" id="cAuto"> Windows 시작 시 자동 실행</label>
  <label class="sw hostonly" title="끄면 원래 Windows 배경화면으로 돌아갑니다"><span id="swLabel">바탕화면 켜짐</span><input type="checkbox" id="cOn" checked><i></i></label>
 </header>
 <div id="homeBody">
  <div class="hrow"><h2>내 바탕화면</h2><small>골라서 바로 바꿔 쓸 수 있습니다</small><div class="sp"></div>
   <button id="bLibImport">파일에서 불러오기</button><button id="bNew" class="pri">＋ 새 바탕화면</button></div>
  <div id="cards"></div>
 </div>
</div>
<div id="app">
 <header>
  <button id="bHome" title="저장하고 목록으로">← 목록</button>
  <div class="logo">Live<b>Desk</b></div>
  <div id="sceneName"></div>
  <button id="bUndo" title="실행취소 (Ctrl+Z)">↶</button>
  <button id="bRedo" title="다시실행 (Ctrl+Y)">↷</button>
  <select id="sRes" title="캔버스 해상도"></select>
  <select id="sFps" title="초당 프레임 (낮을수록 가벼움)"><option value="15">15 FPS</option><option value="24">24 FPS</option><option value="30">30 FPS</option><option value="60">60 FPS</option></select>
  <select id="sQ" title="렌더링 품질 (낮을수록 가벼움)"><option value="1">품질 100%</option><option value="0.75">품질 75%</option><option value="0.5">품질 50%</option></select>
  <button id="bAnim" class="on" title="에디터에서 움직임 재생/정지">▶ 움직임</button>
  <div class="sp"></div>
  <button id="bImport">불러오기</button>
  <button id="bExport">내보내기</button>
  <button id="bPreview">전체 미리보기</button>
  <button id="bApply" class="pri">바탕화면에 적용</button>
 </header>
 <aside id="left">
  <h3>이미지</h3>
  <button id="bUpload" class="wide">＋ 이미지 / GIF 업로드</button>
  <div style="color:var(--mut);font-size:11px;margin-top:5px">캔버스에 끌어다 놓거나 붙여넣기(Ctrl+V)도 됩니다. 움직이는 GIF는 그대로 재생됩니다</div>
  <h3>프리셋</h3>
  <div id="presets"></div>
  <h3>배경</h3>
  <div id="bgBox"></div>
  <h3>레이어</h3>
  <div id="layers"></div>
 </aside>
 <main id="stage">
  <canvas id="cv"></canvas>
  <div id="selbox" hidden><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i><i data-h="rot"></i></div>
 </main>
 <aside id="right"></aside>
</div>
<div id="hint">미리보기 중 — Esc 또는 클릭으로 돌아가기</div>
<div id="toast"></div>
<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<input type="file" id="fAsset" accept="image/*" hidden>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,tx)=>{const e=document.createElement(t);if(c)e.className=c;if(tx!=null)e.textContent=tx;return e;};
const MODE=new URLSearchParams(location.search).get('mode')==='wallpaper'?'wallpaper':'editor';
const TAU=Math.PI*2,RAD=Math.PI/180;
const uid=()=>Math.random().toString(36).slice(2,10);
const host=window.chrome&&window.chrome.webview||null;
const bc=('BroadcastChannel' in window)?new BroadcastChannel('livedesk'):null;

/* ───────── 저장소 (IndexedDB, 실패 시 메모리) ───────── */
const Store={db:null,mem:new Map(),
 async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('livedesk',1);
   r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('assets');};
   r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch(e){this.db=null;}},
 run(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const q=fn(t.objectStore(store));
   t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
 get(s,k){return this.db?this.run(s,'readonly',o=>o.get(k)):Promise.resolve(this.mem.get(s+'/'+k));},
 set(s,k,v){if(!this.db){this.mem.set(s+'/'+k,v);return Promise.resolve();}return this.run(s,'readwrite',o=>o.put(v,k));},
 del(s,k){return this.db?this.run(s,'readwrite',o=>o.delete(k)):Promise.resolve();},
 keys(s){return this.db?this.run(s,'readonly',o=>o.getAllKeys()):Promise.resolve([]);}
};
const images=new Map();
async function loadAsset(id){if(!id||images.has(id))return;try{const b=await Store.get('assets',id);if(b)images.set(id,await toImage(b));}catch(e){}}
/* 움직이는 GIF: 프레임을 모두 풀어 {frames,ends(누적 ms),total,width,height}로 보관한다. 메모리 예산을 넘으면 축소한다. */
async function decodeGif(blob){const dec=new ImageDecoder({data:await blob.arrayBuffer(),type:'image/gif'});
 try{await dec.tracks.ready;await dec.completed;const n=Math.min(dec.tracks.selectedTrack.frameCount,400);if(n<2)return null;
  const frames=[],ends=[];let total=0,k=0;
  for(let i=0;i<n;i++){const{image}=await dec.decode({frameIndex:i});const w=image.displayWidth,h=image.displayHeight;
   if(!k)k=Math.min(1,Math.sqrt(2.4e8/(n*w*h*4)));
   frames.push(await createImageBitmap(image,k<1?{resizeWidth:Math.max(1,Math.round(w*k)),resizeHeight:Math.max(1,Math.round(h*k)),resizeQuality:'medium'}:{}));
   total+=Math.max(20,(image.duration||100000)/1000);ends.push(total);image.close();}
  return{frames,ends,total,width:frames[0].width,height:frames[0].height};}finally{dec.close();}}
async function toImage(blob){if(blob.type==='image/gif'&&'ImageDecoder' in window){try{const g=await decodeGif(blob);if(g)return g;}catch(e){}}return createImageBitmap(blob);}

/* ───────── 장면 모델 ───────── */
const FONTS=[['system-ui,"Malgun Gothic",sans-serif','기본 고딕'],['"Segoe UI Light","Malgun Gothic",sans-serif','가는 고딕'],
 ['Georgia,"Batang",serif','명조'],['Consolas,"D2Coding",monospace','고정폭'],['Impact,"Arial Black",sans-serif','임팩트']];
const BLENDS=[['source-over','기본'],['lighter','더하기(빛)'],['screen','스크린'],['multiply','곱하기'],['overlay','오버레이']];
const KINDS=[['snow','눈'],['rain','비'],['fireflies','반딧불'],['stars','별'],['petals','꽃잎'],['bubbles','방울'],['embers','불씨'],['custom','직접 만들기']];
const SHAPES=[['circle','원'],['rect','사각형'],['round','둥근 사각형'],['tri','삼각형'],['diamond','마름모'],['hex','육각형'],['star','별'],['heart','하트'],['leaf','잎']];
/* 직접 만드는 파티클의 기본값: 방향 90° = 아래, 270° = 위 */
const CUSTOM_D={src:'shape',shape:'star',asset:'',rainbow:false,dir:90,spread:30,spin:60,wobble:20,sizeVar:.5,twinkle:false};
function mk(type,name,o){return Object.assign({id:uid(),type,name,x:960,y:540,w:400,h:200,rot:0,opacity:1,blend:'source-over',visible:true,locked:false,anims:[],props:{}},o);}
const txt=(o)=>Object.assign({color:'#ffffff',font:FONTS[0][0],bold:false,glow:10},o);
const part=(S,name,kind,count,speed,size,color,blend)=>mk('particles',name,{x:S.w/2,y:S.h/2,w:S.w,h:S.h,locked:true,blend:blend||'source-over',props:{kind,count,speed,size,color}});
const cpart=(S,name,count,speed,size,color,o,blend)=>{const L=part(S,name,'custom',count,speed,size,color,blend);Object.assign(L.props,CUSTOM_D,o);return L;};
const clk=(S,name,o,lo)=>mk('clock',name,Object.assign({x:S.w/2,y:S.h*.42,w:S.w*.34,h:S.h*.17,props:txt(Object.assign({style:'digital',h24:true,seconds:false,smooth:false,font:FONTS[1][0]},o))},lo));
const tx=(S,name,y,w,h,o,lo)=>mk('text',name,Object.assign({x:S.w/2,y:S.h*y,w:S.w*w,h:S.h*h,props:txt(o)},lo));
const shp=(S,name,shape,color,o,lo)=>mk('shape',name,Object.assign({x:S.w/2,y:S.h/2,w:S.h*.22,h:S.h*.22,props:Object.assign({shape,color,fill:true,stroke:8,glow:0},o)},lo));
const wav=(S,name,color,amp,speed,hh)=>mk('wave',name,{x:S.w/2,y:S.h*(1-hh/2),w:S.w,h:S.h*hh,locked:true,props:{color,amp,speed}});
/* [분류, [[아이콘, 이름, 만들기(S), 추가 직후 실행(L)?], …]] */
const PRESETS=[
 ['시계 · 날짜',[
  ['🕒','디지털 시계',S=>clk(S,'디지털 시계')],
  ['⏱️','초 표시 시계',S=>clk(S,'초 표시 시계',{seconds:true},{w:S.w*.46})],
  ['🕐','12시간 시계',S=>clk(S,'12시간 시계',{h24:false},{w:S.w*.44})],
  ['🕰️','아날로그 시계',S=>mk('clock','아날로그 시계',{x:S.w*.82,y:S.h*.25,w:S.h*.3,h:S.h*.3,props:txt({style:'analog',h24:true,seconds:true,smooth:false,glow:6})})],
  ['📅','날짜',S=>mk('date','날짜',{x:S.w/2,y:S.h*.55,w:S.w*.3,h:S.h*.05,props:txt({fmt:'long',glow:6})})],
  ['🗓️','짧은 날짜',S=>mk('date','짧은 날짜',{x:S.w/2,y:S.h*.56,w:S.w*.2,h:S.h*.07,props:txt({fmt:'short',glow:6})})],
  ['🌐','영문 날짜',S=>mk('date','영문 날짜',{x:S.w/2,y:S.h*.55,w:S.w*.34,h:S.h*.05,props:txt({fmt:'en',glow:6,font:FONTS[2][0]})})],
 ]],
 ['텍스트',[
  ['🔤','텍스트',S=>tx(S,'텍스트',.7,.3,.07,{text:'Hello, Desktop'})],
  ['🅰️','큰 제목',S=>tx(S,'큰 제목',.3,.6,.17,{text:'TITLE',bold:true,font:FONTS[4][0],glow:0})],
  ['💡','네온 사인',S=>tx(S,'네온 사인',.5,.4,.12,{text:'NEON',color:'#ff5ad1',bold:true,glow:34},{anims:[{type:'fade',amp:25,period:2.2}]})],
  ['⌨️','고정폭 글자',S=>tx(S,'고정폭 글자',.8,.3,.05,{text:'> hello_',color:'#7dffa8',font:FONTS[3][0],glow:8})],
  ['📜','명조 문구',S=>tx(S,'명조 문구',.62,.5,.06,{text:'오늘도 좋은 하루',font:FONTS[2][0],glow:4})],
 ]],
 ['도형',[
  ['⚪','원',S=>shp(S,'원','circle','#ffffff')],
  ['⬜','사각형',S=>shp(S,'사각형','rect','#6c8cff')],
  ['🔲','둥근 사각형',S=>shp(S,'둥근 사각형','round','#6c8cff',null,{w:S.h*.34})],
  ['🔺','삼각형',S=>shp(S,'삼각형','tri','#ff8a5c')],
  ['🔷','마름모',S=>shp(S,'마름모','diamond','#5cd0ff')],
  ['⬡','육각형',S=>shp(S,'육각형','hex','#9d7bff')],
  ['⭐','별 모양',S=>shp(S,'별 모양','star','#ffd84a',{glow:14})],
  ['❤️','하트 모양',S=>shp(S,'하트 모양','heart','#ff5a7a')],
  ['⭕','고리',S=>shp(S,'고리','circle','#ffffff',{fill:false,stroke:10,glow:12})],
 ]],
 ['날씨 · 계절',[

   case'orbit':x+=Math.cos(w)*a.amp;y+=Math.sin(w)*a.amp;break;

  const hand=(f,len,wd)=>{const a=f*TAU;c.lineWidth=r*wd;c.beginPath();c.moveTo(-Math.sin(a)*r*.08,Math.cos(a)*r*.08);c.lineTo(Math.sin(a)*r*len,-Math.cos(a)*r*len);c.stroke();};
  hand(h/12,.5,.05);hand(m/60,.72,.035);if(p.seconds)hand(s/60,.82,.014);c.beginPath();c.arc(0,0,r*.045,0,TAU);c.fill();return;}
 let h=d.getHours(),suf='';if(!p.h24){suf=h<12?' AM':' PM';h=h%12||12;}
 const str=p2(h)+':'+p2(d.getMinutes())+(p.seconds?':'+p2(d.getSeconds()):'');
 textStyle(c,L,K);c.textAlign='center';const dw=c.measureText('0').width,cw=c.measureText(':').width;   // 숫자 폭 고정 → 초가 바뀌어도 흔들리지 않음
 let tw=0;for(const ch of str)tw+=ch===':'?cw:dw;let sw=0;
 if(suf){c.save();c.font=`${p.bold?700:300} ${L.h*.3}px ${p.font}`;sw=c.measureText(suf).width;c.restore();}
 let x=-(tw+sw)/2;for(const ch of str){const w=ch===':'?cw:dw;c.fillText(ch,x+w/2,L.h*.04);x+=w;}

function render(dt,c=ctx,S=scene,V=view){const K=V.s,now=new Date();
 c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';
 c.setTransform(K,0,0,K,V.ox,V.oy);
 const a=S.bg.angle*RAD,cx=S.w/2,cy=S.h/2,r=(Math.abs(Math.cos(a))*S.w+Math.abs(Math.sin(a))*S.h)/2;
 const g=c.createLinearGradient(cx-Math.cos(a)*r,cy-Math.sin(a)*r,cx+Math.cos(a)*r,cy+Math.sin(a)*r);g.addColorStop(0,S.bg.c1);g.addColorStop(1,S.bg.c2);
 c.fillStyle=g;c.fillRect(0,0,S.w,S.h);
 for(const L of S.layers){if(!L.visible||L.opacity<=0)continue;const x=animXf(L,T,S);if(x.op<=0)continue;
  c.save();c.globalAlpha=L.opacity*x.op;c.globalCompositeOperation=L.blend||'source-over';
  c.translate(x.x,x.y);if(x.rot)c.rotate(x.rot*RAD);if(x.s!==1)c.scale(x.s,x.s);
  switch(L.type){
   case'image':{const im=bmpOf(images.get(L.props.asset));if(im){if(L.props.flip)c.scale(-1,1);c.drawImage(im,-L.w/2,-L.h/2,L.w,L.h);}
     else{c.strokeStyle='#ff6b7a';c.lineWidth=2/K*2;c.strokeRect(-L.w/2,-L.h/2,L.w,L.h);}break;}
   case'shape':{const p=L.props;if(p.glow>0){c.shadowColor=p.color;c.shadowBlur=p.glow*K;}shapePath(c,p.shape,L.w/2,L.h/2);
     if(p.fill){c.fillStyle=p.color;c.fill();}else{c.strokeStyle=p.color;c.lineWidth=p.stroke||4;c.lineJoin='round';c.stroke();}break;}
   case'text':drawText(c,L,seqText(L.props,S),K);break;
   case'date':drawText(c,L,dateStr(now,L.props.fmt),K);break;
   case'clock':drawClock(c,L,now,K);break;
   case'particles':drawParticles(c,L,T,dt);break;
   case'wave':drawWave(c,L,T);break;
  }
  c.restore();}
 if(c===ctx&&!isFull()){drawPaths(c,K);updateSel();}}

function analyze(){let cont=false,tk=false,ms=false;
 for(const L of scene.layers){if(!L.visible)continue;
  if(L.anims.length){cont=true;if(L.anims.some(a=>a.type==='parallax'))ms=true;}
  if(L.type==='particles'||L.type==='wave')cont=true;
  if(L.type==='text'&&L.props.seq&&L.props.seq.length>1)cont=true;
  if(L.props.asset){const im=images.get(L.props.asset);if(im&&im.frames)cont=true;}
  if(L.type==='clock'){tk=true;if(L.props.style==='analog'&&L.props.smooth&&L.props.seconds)cont=true;}
  if(L.type==='date')tk=true;}
 dynamic=cont?'cont':tk?'tick':'none';
 if(ms!==needsMouse||MODE==='wallpaper'){needsMouse=ms;if(host&&MODE==='wallpaper')host.postMessage({type:'config',mouse:ms});}}

function layout(){const full=isFull(),dpr=Math.min(window.devicePixelRatio||1,2)*(full?scene.quality||1:1);let cw,ch;
 if(full){cw=innerWidth;ch=innerHeight;view.s=Math.max(cw/scene.w,ch/scene.h)*dpr;view.ox=(cw*dpr-scene.w*view.s)/2;view.oy=(ch*dpr-scene.h*view.s)/2;view.left=view.top=0;}
 else{const r=stage.getBoundingClientRect(),pad=28,k=Math.max(.01,Math.min((r.width-pad*2)/scene.w,(r.height-pad*2)/scene.h));
  cw=scene.w*k;ch=scene.h*k;view.k=k;view.s=k*dpr;view.ox=view.oy=0;view.left=(r.width-cw)/2;view.top=(r.height-ch)/2;}
 cv.style.left=view.left+'px';cv.style.top=view.top+'px';cv.style.width=cw+'px';cv.style.height=ch+'px';
 cv.width=Math.max(1,Math.round(cw*dpr));cv.height=Math.max(1,Math.round(ch*dpr));schedule();}

/* 프레임 스케줄러: 움직임이 있으면 FPS 제한 rAF, 시계만 있으면 1초에 한 번, 정적이면 변경 시에만 그림 */
function schedule(){if(!raf&&!paused&&scene)raf=requestAnimationFrame(frame);}
function frame(now){raf=0;const cont=MODE==='editor'||dynamic==='cont';
 if(cont){schedule();if(now-last<1000/scene.fps-2)return;}
 const dt=animate?Math.min(.1,(now-last)/1000):0;last=now;T+=dt;
 mouse.x+=(mouse.tx-mouse.x)*.12;mouse.y+=(mouse.ty-mouse.y)*.12;
 render(dt);
 if(!cont&&dynamic==='tick'){clearTimeout(tick);tick=setTimeout(schedule,1000-Date.now()%1000+15);}}
function setPaused(p){if(p===paused)return;paused=p;if(p){cancelAnimationFrame(raf);raf=0;clearTimeout(tick);}else{last=performance.now();schedule();}}

async function afterLoad(){PS.forEach((v,k)=>{if(!scene.layers.some(L=>L.id===k))PS.delete(k);});
 await Promise.all(scene.layers.filter(L=>L.props.asset).map(L=>loadAsset(L.props.asset)));
 analyze();layout();if(MODE==='editor')refreshUI();}

addEventListener('resize',()=>scene&&layout());
addEventListener('mousemove',e=>{if(MODE==='wallpaper'||preview){mouse.tx=e.clientX/innerWidth;mouse.ty=e.clientY/innerHeight;}
 else{const r=cv.getBoundingClientRect();mouse.tx=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));mouse.ty=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));}
 if(dynamic!=='cont'&&needsMouse)schedule();});

function syncXf(){const L=selLayer();if(!xf||!L)return;for(const k in xf)if(document.activeElement!==xf[k])xf[k].value=Math.round(L[k]);}
function renderLayers(){const B=$('#layers');B.textContent='';
 for(let i=scene.layers.length-1;i>=0;i--){const L=scene.layers[i],r=el('div','layer'+(L.id===sel?' sel':''));
  const mkb=(t,ti,fn,off)=>{const b=el('button',off?'off':'',t);b.title=ti;b.onclick=e=>{e.stopPropagation();fn();};return b;};
  const nm=el('span','nm',L.name);nm.onclick=()=>select(L.id);
  r.append(mkb('👁','보이기/숨기기',()=>{L.visible=!L.visible;commit();},!L.visible),mkb('🔒','잠금 (캔버스에서 클릭 선택 안 됨)',()=>{L.locked=!L.locked;commit();},!L.locked),nm,
   mkb('▲','위로',()=>moveLayer(L.id,1)),mkb('▼','아래로',()=>moveLayer(L.id,-1)),mkb('✕','삭제',()=>removeLayer(L.id)));B.append(r);}
 if(!scene.layers.length)B.append(el('div','empty','비어 있음'));}
function renderBg(){const B=$('#bgBox');B.textContent='';B.append(row('색 1',scene.bg,'c1','color'),row('색 2',scene.bg,'c2','color'),row('방향',scene.bg,'angle','range',{min:0,max:360,step:1}));}
const RES=[[1920,1080],[2560,1440],[3840,2160],[2560,1080],[3440,1440],[1080,1920]];
function refreshUI(){renderLayers();renderInspector();renderBg();
 const s=$('#sRes'),v=scene.w+'x'+scene.h;s.textContent='';let has=false;for(const[w,h]of RES){s.add(new Option(w+' × '+h,w+'x'+h));if(w+'x'+h===v)has=true;}
 if(!has)s.add(new Option(scene.w+' × '+scene.h,v));s.add(new Option('내 화면에 맞춤','screen'));s.value=v;
 $('#sFps').value=String(scene.fps);$('#sQ').value=String(scene.quality||1);}
function setRes(w,h){const sx=w/scene.w,sy=h/scene.h;for(const L of scene.layers){L.x*=sx;L.y*=sy;const full=L.type==='particles'||L.type==='wave';L.w*=sx;L.h*=full?sy:sx;
  for(const a of L.anims)if(a.type==='path')a.pts=a.pts.map(p=>[Math.round(p[0]*sx),Math.round(p[1]*sy)]);}
 scene.w=w;scene.h=h;commit();layout();refreshUI();}
function updateSel(){const sb=$('#selbox'),L=selLayer();if(!L||pathEdit){sb.hidden=true;return;}sb.hidden=false;const k=view.k;
 sb.style.width=L.w*k+'px';sb.style.height=L.h*k+'px';sb.style.left=view.left+L.x*k+'px';sb.style.top=view.top+L.y*k+'px';sb.style.transform=`translate(-50%,-50%) rotate(${L.rot}deg)`;}
const toScene=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/view.k,y:(e.clientY-r.top)/view.k};};
const toLocal=(L,p)=>{const dx=p.x-L.x,dy=p.y-L.y,a=-L.rot*RAD,c=Math.cos(a),s=Math.sin(a);return{x:dx*c-dy*s,y:dx*s+dy*c};};
const inside=(L,p)=>{const l=toLocal(L,p);return Math.abs(l.x)<=L.w/2&&Math.abs(l.y)<=L.h/2;};
function hitTest(p){const cur=selLayer();if(cur&&cur.visible&&inside(cur,p))return cur;
 for(let i=scene.layers.length-1;i>=0;i--){const L=scene.layers[i];if(L.visible&&!L.locked&&inside(L,p))return L;}return null;}

/* 이미지를 자산으로 저장한다. GIF는 원본 그대로 두어 움직임을 살리고, 그 밖의 큰 이미지는 4096px로 줄인다. */
async function storeImage(file){if(!file||!file.type.startsWith('image/'))return null;let bmp;try{bmp=await createImageBitmap(file);}catch(e){toast('이미지를 읽을 수 없습니다');return null;}
 let blob=file,im=bmp;const MAX=4096,m=Math.max(bmp.width,bmp.height);
 if(file.type==='image/gif'){try{im=await toImage(file);}catch(e){}}
 else if(m>MAX){const k=MAX/m,c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  blob=await new Promise(r=>c.toBlob(r,'image/png'));im=await createImageBitmap(blob);}
 const id=uid();await Store.set('assets',id,blob);images.set(id,im);return{id,im};}
async function addImage(file){if(!curId)return;const r=await storeImage(file);if(!r)return;const bmp=r.im;
 const k=Math.min(1,scene.w*.5/bmp.width,scene.h*.6/bmp.height);
 addLayer(mk('image',file.name.replace(/\.[^.]+$/,'')||'이미지',{x:scene.w/2,y:scene.h/2,w:bmp.width*k,h:bmp.height*k,props:{asset:r.id,flip:false}}));
 if(bmp.frames)toast('움직이는 GIF '+bmp.frames.length+'프레임을 불러왔습니다');}
const blobToUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
async function exportScene(){const assets={};for(const L of scene.layers)if(L.props.asset&&!assets[L.props.asset]){const b=await Store.get('assets',L.props.asset);if(b)assets[L.props.asset]=await blobToUrl(b);}
 const a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({livedesk:1,scene,assets})],{type:'application/json'}));a.download=((entry(curId)||{}).name||'wallpaper').replace(/[\\/:*?"<>|]/g,'_')+'.livedesk.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
async function readPack(file){const d=JSON.parse(await file.text());if(!d.scene||!Array.isArray(d.scene.layers))throw 0;
 for(const id in d.assets||{}){const b=await(await fetch(d.assets[id])).blob();await Store.set('assets',id,b);images.delete(id);}return d.scene;}
async function importScene(file){try{scene=await readPack(file);sel=null;PS.clear();await afterLoad();commit();toast('불러왔습니다');}catch(e){toast('올바른 LiveDesk 파일이 아닙니다');}}
async function apply(){clearTimeout(saveT);await putScene(curId,scene);await applyId(curId);
 toast(host?'바탕화면에 적용했습니다':'저장했습니다 — LiveDesk 호스트를 실행하면 바탕화면에 표시됩니다');}

/* ───────── 보관함: 저장해 둔 바탕화면 목록 ─────────
   kv 'lib' = [{id,name,updated}], 'scene:<id>' = 장면 JSON, 'thumb:<id>' = 미리보기, 'active' = 적용 중인 id, 'live' = 배경화면이 읽는 장면 */
let lib=[],curId=null,activeId=null;
const hostState={enabled:true,autostart:false};
const entry=id=>lib.find(e=>e.id===id);
const saveLib=()=>Store.set('kv','lib',JSON.stringify(lib));
const parseScene=s=>{try{const o=JSON.parse(s);return o&&Array.isArray(o.layers)?o:null;}catch(e){return null;}};
async function makeThumb(S){try{await Promise.all(S.layers.filter(L=>L.props.asset).map(L=>loadAsset(L.props.asset)));
 const c=document.createElement('canvas');c.width=480;c.height=Math.max(1,Math.round(480*S.h/S.w));
 render(0,c.getContext('2d'),S,{s:480/S.w,ox:0,oy:0});return c.toDataURL('image/jpeg',.8);}catch(e){return'';}}
async function putScene(id,S,name){await Store.set('kv','scene:'+id,JSON.stringify(S));await Store.set('kv','thumb:'+id,await makeThumb(S));
 let e=entry(id);if(!e){e={id,name:name||'바탕화면'};lib.push(e);}else if(name)e.name=name;e.updated=Date.now();await saveLib();return e;}
function freeName(base){let n=base,i=2;while(lib.some(e=>e.name===n))n=base+' '+i++;return n;}
async function applyId(id){const j=await Store.get('kv','scene:'+id);if(!j)return;await Store.set('kv','live',j);activeId=id;await Store.set('kv','active',id);
 if(bc)bc.postMessage('apply');if(host){host.postMessage({type:'apply'});if(!hostState.enabled)host.postMessage({type:'setEnabled',on:true});}}
async function openScene(id){const j=await Store.get('kv','scene:'+id),S=parseScene(j);if(!S)return;scene=S;curId=id;sel=null;hist=[j];hi=0;PS.clear();
 $('#sceneName').textContent=entry(id).name;document.body.classList.remove('home');setPaused(false);await afterLoad();}
async function goHome(){cancelPath();if(curId){clearTimeout(saveT);if(preview)setPreview(false);await putScene(curId,scene);}
 curId=null;sel=null;setPaused(true);document.body.classList.add('home');await renderHome();}
async function newScene(){const id=uid();await putScene(id,defaultScene(),freeName('새 바탕화면'));await openScene(id);}
async function dupScene(e){const S=parseScene(await Store.get('kv','scene:'+e.id));if(!S)return;await putScene(uid(),S,freeName(e.name+' 복사'));await renderHome();}
async function delScene(e){lib=lib.filter(x=>x!==e);await saveLib();await Store.del('kv','scene:'+e.id);await Store.del('kv','thumb:'+e.id);
 if(activeId===e.id){activeId=null;await Store.del('kv','active');}await renderHome();}
async function importToLib(file){try{const S=await readPack(file);await putScene(uid(),S,freeName(file.name.replace(/(\.livedesk)?\.json$/i,'')||'불러온 바탕화면'));await renderHome();toast('보관함에 추가했습니다');}
 catch(e){toast('올바른 LiveDesk 파일이 아닙니다');}}
function renameScene(e,nm){const i=el('input');i.type='text';i.value=e.name;nm.textContent='';nm.append(i);i.focus();i.select();let done=false;
 const fin=async ok=>{if(done)return;done=true;const v=i.value.trim();if(ok&&v&&v!==e.name){e.name=v;await saveLib();}renderHome();};
 i.onkeydown=ev=>{if(ev.key==='Enter')fin(true);else if(ev.key==='Escape')fin(false);};i.onblur=()=>fin(true);}
async function renderHome(){const out=[];
 for(const e of lib){const act=e.id===activeId,th=await Store.get('kv','thumb:'+e.id),c=el('div','wc'+(act?' act':'')),t=el('div','th');
  const use=async()=>{await applyId(e.id);await renderHome();toast('바탕화면을 "'+e.name+'"(으)로 바꿨습니다');};
  if(th)t.style.backgroundImage='url('+th+')';t.title='클릭하면 이 바탕화면을 사용합니다';t.onclick=use;if(act)t.append(el('div','badge','사용 중'));
  const nm=el('div','nm',e.name);nm.title='더블클릭하여 이름 변경';nm.ondblclick=()=>renameScene(e,nm);
  const bt=el('div','bt'),b=(cls,tx,ti,fn)=>{const x=el('button',cls,tx);if(ti)x.title=ti;x.onclick=fn;return x;};
  const del=b('ic','🗑','삭제',()=>{if(del.classList.contains('sure')){delScene(e);return;}del.classList.add('sure');del.textContent='삭제?';setTimeout(()=>{del.classList.remove('sure');del.textContent='🗑';},2500);});
  bt.append(b(act?'on':'pri',act?'✓ 사용 중':'사용하기',act?'다시 적용':'',use),b('','편집','',()=>openScene(e.id)),el('div','sp'),
   b('ic','✎','이름 변경',()=>renameScene(e,nm)),b('ic','⧉','복제',()=>dupScene(e)),del);
  c.append(t,nm,bt);out.push(c);}
 if(!lib.length)out.push(el('div','empty','저장된 바탕화면이 없습니다. "＋ 새 바탕화면"으로 만들어 보세요.'));
 $('#cards').replaceChildren(...out);}
function syncHost(){$('#cOn').checked=hostState.enabled;$('#swLabel').textContent=hostState.enabled?'바탕화면 켜짐':'바탕화면 꺼짐';$('#cAuto').checked=hostState.autostart;}
if(host&&MODE==='editor'){document.body.classList.add('hosted');
 host.addEventListener('message',e=>{const m=e.data||{};if(m.type==='state'){hostState.enabled=!!m.enabled;hostState.autostart=!!m.autostart;syncHost();}
  else if(m.type==='fonts'&&Array.isArray(m.list))setFonts(m.list);});}
/* 호스트가 알려 준 "이 PC에 설치된 글꼴"을 기본 글꼴 뒤에 붙인다 */
const BASE_FONTS=FONTS.length;
function setFonts(list){FONTS.length=BASE_FONTS;for(const n of list){const s=String(n).replace(/["\\]/g,'');if(s)FONTS.push(['"'+s+'","Malgun Gothic",sans-serif',s]);}if(curId)renderInspector();}
/* 처음 실행(또는 이전 버전에서 넘어온 경우): 기존 초안/적용본을 보관함 항목으로 옮긴다 */
async function loadLib(){let a=null;try{a=JSON.parse(await Store.get('kv','lib')||'null');}catch(e){}
 if(Array.isArray(a)){lib=a;activeId=await Store.get('kv','active')||null;if(activeId&&!entry(activeId))activeId=null;return;}
 lib=[];const d=await Store.get('kv','draft'),l=await Store.get('kv','live'),first=uid();
 await putScene(first,parseScene(d)||parseScene(l)||defaultScene(),'내 바탕화면');activeId=first;
 if(parseScene(l)&&parseScene(d)&&l!==d){activeId=uid();await putScene(activeId,parseScene(l),'적용 중인 바탕화면');}
 else if(!parseScene(l))await Store.set('kv','live',await Store.get('kv','scene:'+first));
 await Store.set('kv','active',activeId);await Store.del('kv','draft');}
function setPreview(on){preview=on;document.body.classList.toggle('full',on);document.body.classList.toggle('pv',on);layout();}

function buildUI(){
 const G=$('#presets');PRESETS.forEach(([cat,items],ci)=>{const d=el('details','cat'),sm=el('summary','',cat),g=el('div','grid');d.open=ci===0;sm.append(el('small','',String(items.length)));
  for(const[ic,name,make,after]of items){const b=el('button');b.append(el('span','',ic),document.createTextNode(name));b.onclick=()=>{const L=make(scene);addLayer(L);if(after)after(L);};g.append(b);}
  d.append(sm,g);G.append(d);});
 $('#bUpload').onclick=()=>$('#fImg').click();
 $('#fImg').onchange=async e=>{for(const f of e.target.files)await addImage(f);e.target.value='';};
 $('#bImport').onclick=()=>$('#fJson').click();
 $('#fJson').onchange=e=>{const f=e.target.files[0];if(f)(curId?importScene:importToLib)(f);e.target.value='';};
 $('#bHome').onclick=goHome;$('#bNew').onclick=newScene;$('#bLibImport').onclick=()=>$('#fJson').click();
 $('#cOn').onchange=e=>{hostState.enabled=e.target.checked;syncHost();host.postMessage({type:'setEnabled',on:e.target.checked});};
 $('#cAuto').onchange=e=>host.postMessage({type:'setAutoStart',on:e.target.checked});
 $('#bExport').onclick=exportScene;$('#bApply').onclick=apply;$('#bPreview').onclick=()=>setPreview(true);
 $('#bUndo').onclick=()=>travel(-1);$('#bRedo').onclick=()=>travel(1);
 $('#bAnim').onclick=e=>{animate=!animate;e.target.classList.toggle('on',animate);e.target.textContent=(animate?'▶':'⏸')+' 움직임';};
 $('#sRes').onchange=e=>{if(e.target.value==='screen'){const d=window.devicePixelRatio||1;setRes(Math.round(screen.width*d),Math.round(screen.height*d));}else{const[w,h]=e.target.value.split('x').map(Number);setRes(w,h);}};
 $('#sFps').onchange=e=>{scene.fps=+e.target.value;commit();};
 $('#sQ').onchange=e=>{scene.quality=+e.target.value;commit();};
 new ResizeObserver(()=>scene&&layout()).observe(stage);
 stage.addEventListener('pointerdown',e=>{if(preview){setPreview(false);return;}if(e.button!==0)return;const p=toScene(e),h=e.target.dataset&&e.target.dataset.h,L=selLayer();
  if(pathEdit){const a=pathEdit.a,PL=pathEdit.L,q=[Math.round(p.x-PL.x),Math.round(p.y-PL.y)],tol=10/view.k;
   let i=a.pts.findIndex(o=>Math.hypot(o[0]-q[0],o[1]-q[1])<=tol);if(i<0){a.pts.push(q);i=a.pts.length-1;}
   drag={kind:'pt',L:PL,a,i,moved:true};stage.setPointerCapture(e.pointerId);e.preventDefault();return;}
  if(h&&L)drag={kind:h==='rot'?'rot':'size',L,w0:L.w,h0:L.h};
  else{const hit=hitTest(p);select(hit?hit.id:null);if(hit)drag={kind:'move',L:hit,dx:p.x-hit.x,dy:p.y-hit.y};}
  if(drag){stage.setPointerCapture(e.pointerId);e.preventDefault();}});
 stage.addEventListener('pointermove',e=>{if(!drag)return;const p=toScene(e),L=drag.L;
  if(drag.kind==='pt'){drag.a.pts[drag.i]=[Math.round(p.x-L.x),Math.round(p.y-L.y)];return;}
  if(drag.kind==='move'){L.x=Math.round(p.x-drag.dx);L.y=Math.round(p.y-drag.dy);}
  else if(drag.kind==='size'){const l=toLocal(L,p);let w=Math.max(8,Math.abs(l.x)*2),h=Math.max(8,Math.abs(l.y)*2);
   if(!e.shiftKey){const k=Math.max(w/drag.w0,h/drag.h0);w=drag.w0*k;h=drag.h0*k;}L.w=Math.round(w);L.h=Math.round(h);}
  else{let a=Math.atan2(p.y-L.y,p.x-L.x)/RAD+90;if(e.shiftKey)a=Math.round(a/15)*15;L.rot=Math.round(((a+540)%360)-180);}
  drag.moved=true;syncXf();updateSel();});
 const end=()=>{const d=drag;drag=null;if(d&&d.moved){commit();if(d.kind==='pt'&&pathEdit)renderInspector();}};
 stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
 addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drop');});
 addEventListener('dragleave',()=>document.body.classList.remove('drop'));
 addEventListener('drop',async e=>{e.preventDefault();document.body.classList.remove('drop');for(const f of e.dataTransfer.files){if(/json$/i.test(f.name))await(curId?importScene:importToLib)(f);else await addImage(f);}});
 addEventListener('paste',async e=>{for(const it of e.clipboardData.items)if(it.type.startsWith('image/'))await addImage(it.getAsFile());});
 addEventListener('keydown',e=>{if(!curId)return;if(preview){if(e.key==='Escape')setPreview(false);return;}
  if(pathEdit&&!/^(text|number)$/.test(document.activeElement.type||'')){
   if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();endPath();return;}
   if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();pathEdit.a.pts.pop();commit();renderInspector();return;}}
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)&&document.activeElement.type!=='range')return;
  const L=selLayer(),ctrl=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(ctrl&&k==='z'){e.preventDefault();travel(e.shiftKey?1:-1);}
  else if(ctrl&&k==='y'){e.preventDefault();travel(1);}
  else if(ctrl&&k==='d'){e.preventDefault();duplicate();}
  else if(L&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();removeLayer(L.id);}
  else if(L&&e.key.startsWith('Arrow')){e.preventDefault();const d=e.shiftKey?10:1;
   if(e.key==='ArrowLeft')L.x-=d;if(e.key==='ArrowRight')L.x+=d;if(e.key==='ArrowUp')L.y-=d;if(e.key==='ArrowDown')L.y+=d;syncXf();commit();}
  else if(e.key==='Escape')select(null);});
}

/* ───────── 시작 ───────── */
(async()=>{await Store.open();
 if(MODE==='editor'){buildUI();await loadLib();
  try{const used=new Set();for(const k of['live',...lib.map(e=>'scene:'+e.id)]){const s=await Store.get('kv',k);if(s)for(const L of JSON.parse(s).layers)if(L.props.asset)used.add(L.props.asset);}
   for(const k of await Store.keys('assets'))if(!used.has(k))Store.del('assets',k);}catch(e){}
  await goHome();if(host)host.postMessage({type:'ready'});}
 else{const j=await Store.get('kv','live')||await Store.get('kv','draft');scene=parseScene(j)||defaultScene();
  last=performance.now();await afterLoad();schedule();}
 window.__ld={get scene(){return scene;},get dynamic(){return dynamic;}};
})();
</script>
</body>
